<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Crimson Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#C81E3A" />
      <stop offset="55%" stop-color="#5A0512" />
      <stop offset="100%" stop-color="#090103" />
    </radialGradient>

    <!-- Liquid Ruby Glow Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#990022" />
    </linearGradient>

    <!-- Dry Ice Vapor Smoke Gradient -->
    <linearGradient id="vaporGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFB3C1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Badge Base -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#FF4D6D" stroke-width="6" stroke-opacity="0.3" />

  <!-- Dry Ice Vapor Waves Floating Above Glass -->
  <g filter="url(#glow)">
    <!-- Vapor Stream 1 -->
    <path d="M210,190 Q225,140 195,110 T230,50" fill="none" stroke="url(#vaporGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Vapor Stream 2 -->
    <path d="M256,180 Q280,130 250,90 T285,40" fill="none" stroke="url(#vaporGrad)" stroke-width="20" stroke-linecap="round" />
    <!-- Vapor Stream 3 -->
    <path d="M300,190 Q285,145 315,115 T280,55" fill="none" stroke="url(#vaporGrad)" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Cocktail Liquid inside Bowl -->
  <polygon points="155,200 357,200 256,310" fill="url(#liquidGrad)" />

  <!-- Sleek Glass Outline -->
  <!-- Bowl Rim & Triangle -->
  <path d="M130,190 L382,190 L256,325 Z" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Glass Stem -->
  <line x1="256" y1="325" x2="256" y2="420" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
  
  <!-- Glass Foot Base -->
  <line x1="180" y1="420" x2="332" y2="420" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />

  <!-- Subzero Frost Sparkle Accents -->
  <circle cx="256" cy="220" r="6" fill="#FFFFFF" />
  <circle cx="210" cy="235" r="4" fill="#FFB3C1" />
  <circle cx="300" cy="230" r="5" fill="#FFFFFF" />
</svg>
